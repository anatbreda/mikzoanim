<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2a9d8f">
  <title>ניהול המדריך של הקבוצה</title>
  <link rel="stylesheet" href="/css/styles.css?v=202609171210">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    /* הריפוד נקבע בזמן ריצה לפי הגובה האמיתי של הפס (ראו admin.js).
       ערך קבוע כאן היה מתיישן בכל פעם שתוכן הפס משתנה. */
    body { padding-bottom: 96px; }

    #publish-bar {
      position: fixed;
      inset-inline: 0;
      bottom: 0;
      z-index: 20;
      background: var(--card);
      border-top: 1px solid var(--line);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.12);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    }

    #publish-bar .bar-status {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #publish-bar .bar-actions { display: flex; gap: 8px; }
    #publish-bar .bar-actions > .btn { flex: 1; }

    /* חלון ההפצה */
    #share-dialog {
      border: 0;
      border-radius: var(--radius);
      padding: 0;
      max-width: 420px;
      width: calc(100% - 32px);
      background: var(--card);
      color: var(--ink);
    }
    #share-dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
    #share-dialog .sheet { padding: 20px 16px; }
    #share-dialog .sheet > * + * { margin-top: 10px; }
    #share-dialog h2 { font-size: 20px; margin: 0; }
    #share-dialog .link-box {
      background: var(--chip);
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 13px;
      direction: ltr;
      text-align: left;
      word-break: break-all;
      user-select: all;
    }
    .btn-whatsapp { background: #25d366; color: #05321a; }
    .btn-whatsapp:active { background: #1eb85a; }

    #danger-zone { margin-top: 8px; }
    #danger-zone summary { color: var(--ink-soft); font-size: 13px; }
    #danger-zone .stack > * + * { margin-top: 8px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="publish-bar"></div>

  <dialog id="share-dialog" aria-labelledby="share-title"></dialog>

  <script src="/js/util.js?v=202609171210"></script>
  <script src="/js/professions.js?v=202609171210"></script>
  <script src="/js/vcard.js?v=202609171210"></script>
  <script src="/js/zip.js?v=202609171210"></script>
  <script src="/js/whatsapp.js?v=202609171210"></script>
  <script src="/js/classify.js?v=202609171210"></script>
  <script src="/js/pipeline.js?v=202609171210"></script>
  <script src="/js/store.js?v=202609171210"></script>
  <script src="/js/app.js?v=202609171210"></script>
  <script src="/group/admin.js?v=202609171210"></script>
</body>
</html>
